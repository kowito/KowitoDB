name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format check
        run: cargo fmt --all --check
      # --locked: fail if Cargo.lock is stale (e.g. a version bump that didn't
      # sync it), since `cargo publish --locked` would fail the same way.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  sdks:
    name: SDKs (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Go SDK
        working-directory: sdk/go
        run: go build ./... && go vet ./...
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install + import Python SDK
        run: |
          python -m pip install ./sdk/python
          cd /tmp && python -c "import kowitodb; print(kowitodb.KowitoDBClient)"
